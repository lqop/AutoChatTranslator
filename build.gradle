plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = '1.2.0'
group = 'com.autochattranslator'
archivesBaseName = 'autochattranslator-1.20.1'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

sourceSets {
    guiTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations {
    guiTestImplementation.extendsFrom implementation
}

minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        client {
            workingDirectory project.file('run')
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', project.file('build/createSrgToMcp/output.srg').absolutePath
            mods {
                autochattranslator {
                    source sourceSets.main
                    if (project.hasProperty('guiTest')) {
                        source sourceSets.guiTest
                    }
                }
            }
        }
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.minecraftforge.net/' }
    maven {
        url = 'https://maven.isxander.dev/releases'
        content { includeGroup 'dev.isxander' }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.28'
    implementation fg.deobf('dev.isxander:yet-another-config-lib:3.6.6+1.20.1-forge')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('processResources', ProcessResources).configure {
    filteringCharset = 'UTF-8'
    var replaceProperties = [
            minecraft_version      : '1.20.1',
            minecraft_version_range: '[1.20.1,1.21)',
            forge_version          : '47.4.28',
            forge_version_range    : '[47,)',
            loader_version_range   : '[47,)',
            mod_id                 : 'autochattranslator',
            mod_name               : '自动聊天翻译 (Auto Chat Translator)',
            mod_license            : 'MIT',
            mod_version            : project.version,
            mod_authors            : 'Qoder',
            mod_description        : '自动翻译聊天并保留原文。支持 MyMemory、Google、OpenAI 兼容接口及 DeepL。点击配置按钮或输入 /ctrans config 打开中文 YACL 设置界面。'
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'    : 'autochattranslator',
                'Specification-Vendor'   : 'Qoder',
                'Specification-Version'  : '1',
                'Implementation-Title'   : project.name,
                'Implementation-Version' : project.jar.archiveVersion,
                'Implementation-Vendor'  : 'Qoder'
        ])
    }
    finalizedBy 'reobfJar'
}
